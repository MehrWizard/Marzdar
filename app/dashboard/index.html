        min-height: 100vh;
      }
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        z-index: 0;
        transition: opacity 0.4s ease;

          transparent 75%

        opacity: 0.9;
      }
      html.theme-black body::before,
      html[data-theme-mode="black"] body::before {

          transparent 70%

        color: #f4f4f5;
      }

        background-color: #f4f7fc;
        color: #1a202c;
      }

          }

            if (/^\d+$/.test(key)) {

              doc.style.setProperty("--chakra-colors-primary-" + key, palette[key], "important");

          }

          doc.style.setProperty("--theme-accent-bg-light", palette.bgLight, "important");
